<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyclone Archive — asset diagnostic</title>
<style>
  body{margin:0;padding:24px;background:#0e1210;color:#e7ece8;
       font:15px/1.6 ui-monospace,Menlo,monospace}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:#6d7a6f;margin-bottom:24px;font-size:13px}
  .row{border-top:1px solid #23291f;padding:12px 0;display:flex;gap:14px;align-items:flex-start}
  .row:last-child{border-bottom:1px solid #23291f}
  .k{flex:0 0 240px;color:#9aa79c}
  .v{flex:1;word-break:break-all}
  .ok{color:#4ade80}
  .bad{color:#f87171;font-weight:700}
  .warn{color:#fbbf24}
  h2{font-size:14px;margin:32px 0 0;color:#9aa79c;text-transform:uppercase;letter-spacing:.1em}
  .swatch{margin-top:8px;border:1px solid #23291f;padding:10px;background:#131a15}
  .swatch img{display:block;max-width:320px;height:auto}
  video{max-width:320px;border:1px solid #23291f;display:block;margin-top:8px}
  #summary{margin:24px 0;padding:16px;border:2px solid #23291f;background:#111614;font-size:15px}
  #summary p{margin:0 0 8px}
  #summary p:last-child{margin:0}
</style>
</head>
<body>

<h1>Cyclone Archive — asset diagnostic</h1>
<p class="sub">Upload this file next to index.html, then open /debug.html on the live site.</p>

<div id="summary">Running checks…</div>

<h2>Environment</h2>
<div id="env"></div>

<h2>Logo</h2>
<div id="logo"></div>
<div class="swatch">
  <div style="font-size:12px;color:#6d7a6f;margin-bottom:6px">raw image, no CSS sizing applied:</div>
  <img id="logoImg" src="assets/logo-green-dark.png" alt="logo">
</div>

<h2>Video</h2>
<div id="vid"></div>
<div class="swatch">
  <div style="font-size:12px;color:#6d7a6f;margin-bottom:6px">plain video element with controls — press play:</div>
  <video id="testVid" src="assets/scanner.mp4" controls muted playsinline preload="metadata"></video>
</div>

<h2>Autoplay test</h2>
<div id="auto"></div>

<script>
function add(host, k, v, cls){
  var d = document.createElement('div'); d.className = 'row';
  d.innerHTML = '<div class="k"></div><div class="v ' + (cls||'') + '"></div>';
  d.children[0].textContent = k;
  d.children[1].textContent = v;
  document.getElementById(host).appendChild(d);
}

var problems = [];

/* ---------- environment ---------- */
var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
add('env','prefers-reduced-motion', reduced ? 'REDUCE  (this alone hides the hero video by design)' : 'no-preference',
    reduced ? 'bad' : 'ok');
if(reduced) problems.push('Reduce Motion is switched on in your OS settings. The hero video is deliberately hidden when it is. Turn it off to see the video.');

add('env','page URL', location.href);
add('env','viewport', innerWidth + ' x ' + innerHeight + ' @ dpr ' + (devicePixelRatio||1));
add('env','user agent', navigator.userAgent);
add('env','save-data', (navigator.connection && navigator.connection.saveData) ? 'ON (browsers may block media)' : 'off',
    (navigator.connection && navigator.connection.saveData) ? 'warn' : 'ok');

/* ---------- logo ---------- */
var li = document.getElementById('logoImg');
li.addEventListener('load', function(){
  add('logo','fetch','loaded OK','ok');
  add('logo','natural size', li.naturalWidth + ' x ' + li.naturalHeight);
  if(li.naturalWidth === 926 && li.naturalHeight === 339){
    add('logo','which file','TRIMMED version — correct','ok');
  } else if(li.naturalWidth === 1000 && li.naturalHeight === 500){
    add('logo','which file','ORIGINAL padded version — 32% empty space','bad');
    problems.push('The logo on the server is the original 1000x500 padded file, not the trimmed 926x339 one.');
  } else {
    add('logo','which file','unrecognised dimensions','warn');
  }
  done();
});
li.addEventListener('error', function(){
  add('logo','fetch','FAILED — 404 or blocked','bad');
  problems.push('assets/logo-green-dark.png could not be loaded at all.');
  done();
});

/* ---------- video ---------- */
var tv = document.getElementById('testVid');
tv.addEventListener('loadedmetadata', function(){
  add('vid','fetch','metadata loaded OK','ok');
  add('vid','dimensions', tv.videoWidth + ' x ' + tv.videoHeight);
  add('vid','duration', tv.duration.toFixed(2) + 's');
  add('vid','readyState', String(tv.readyState) + ' (2+ means playable)');
  done();
});
tv.addEventListener('error', function(){
  var m = tv.error ? (tv.error.code + ': ' + (tv.error.message||'no message')) : 'unknown';
  add('vid','fetch','FAILED — ' + m,'bad');
  problems.push('assets/scanner.mp4 could not be decoded or found (' + m + ').');
  done();
});

/* ---------- autoplay ---------- */
var probe = document.createElement('video');
probe.src = 'assets/scanner.mp4';
probe.muted = true; probe.playsInline = true;
probe.style.cssText = 'position:absolute;width:2px;height:2px;opacity:0;pointer-events:none';
document.body.appendChild(probe);
var p = probe.play();
if(p && p.then){
  p.then(function(){
    add('auto','muted autoplay','ALLOWED — video should play on the homepage','ok');
    probe.pause(); done();
  }, function(err){
    add('auto','muted autoplay','BLOCKED — ' + (err && err.name ? err.name : 'refused'),'bad');
    problems.push('This browser is refusing muted autoplay, so the hero shows its still frame instead.');
    done();
  });
} else {
  add('auto','muted autoplay','could not test (no promise returned)','warn');
  done();
}

/* ---------- summary ---------- */
var fired = 0;
function done(){
  fired++;
  if(fired < 3) return;
  var s = document.getElementById('summary');
  if(!problems.length){
    s.innerHTML = '<p class="ok"><strong>All assets load and autoplay is allowed.</strong></p>' +
      '<p>If the homepage still shows no video, the cause is CSS layering rather than the files ' +
      '— send me a screenshot of the hero and I will look at the stack.</p>';
  } else {
    s.innerHTML = '<p class="bad"><strong>Found ' + problems.length + ' problem' +
      (problems.length>1?'s':'') + ':</strong></p>' +
      problems.map(function(t){ return '<p>&bull; ' + t + '</p>'; }).join('');
  }
}
setTimeout(function(){ while(fired < 3) done(); }, 6000);
</script>
</body>
</html>
